# Render 배포 설정 — Render에서 New → Blueprint → 이 저장소를 고르면 아래대로 만들어집니다.
services:
  - type: web
    name: english-quoridor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HTTPS        # Render가 https를 붙여 주므로 자체 인증서 서버는 끔
        value: "0"
      - key: NODE_VERSION
        value: "20"
      - key: TEACHER_PIN  # (선택) 교사 PIN — 배포 화면에서 입력하거나 비워 둠
        sync: false
